# The production compose file for the Linode box. Lives in ~/letsmeet there, next to a
# .env holding the secrets (docs/deploy.md §1) and a ./data directory owned by uid 1000
# (the container's `node` user) for the SQLite file — the one path that needs backups.
services:
  letsmeet:
    # IMAGE_TAG is the commit the deploy job tested and built; the box's deploy script
    # writes it into .env so `docker compose up` here always means "the tested commit",
    # never "whatever :latest is right now".
    image: ghcr.io/kenalba/letsmeet:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Loopback only: nginx terminates TLS for letsmeet.lol and proxies here. Never publish
    # 8787 to the world — PUBLIC_URL's origin is what OAuth trusts, and the app itself
    # speaks plain HTTP.
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    volumes:
      - ./data:/data
    # A single Node process needs none of this; it is here so a compromised one gets
    # nothing extra either. Read-only root, no capabilities, no privilege escalation,
    # bounded memory and process count, and logs that rotate instead of filling the disk.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    # PID 1 is tini: signals reach the server, and a stop is a clean shutdown.
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # The slim image has no curl/wget; node's global fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
