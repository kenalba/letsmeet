# /etc/nginx/sites-available/letsmeet.lol — the vhosts in front of the letsmeet container:
# the apex, and *.sez.letsmeet.lol (one wildcard certificate, docs/deploy.md §3).
# The TLS lines are certbot's; everything else is ours.

# Per-address request budget in front of the app's own limiters: 20 requests/second
# sustained, bursts of 40 absorbed, the rest answered 503 without reaching Node.
limit_req_zone $binary_remote_addr zone=letsmeet:1m rate=20r/s;

server {
    server_name letsmeet.lol;

    # The app emits these too; hide its copies and set ours with `always` so the answers
    # nginx generates itself (a 413, a 502, a rate-limit 503) carry exactly one set.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Matches MAX_BODY_BYTES in src/web/server.ts.
    client_max_body_size 256k;

    location / {
        limit_req zone=letsmeet burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Append the real client as the last hop: the app's rate limiters key on the
        # final X-Forwarded-For entry. Only this vhost can reach the app's loopback port
        # from outside the box, so that last hop is always nginx's own.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/letsmeet.lol/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/letsmeet.lol/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# <name>.sez.letsmeet.lol: the same app, which serves one person's friend view and feed on
# this host and nothing else (aliasHostOnly, src/web/server.ts). Identical to the apex block
# but for the certificate — the wildcard one certbot issued by DNS-01 (docs/deploy.md §3).
# `proxy_set_header Host $host` is what tells the app which name was asked for.
server {
    server_name *.sez.letsmeet.lol;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 256k;

    location / {
        limit_req zone=letsmeet burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/letsmeet-sez/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsmeet-sez/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = letsmeet.lol) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name letsmeet.lol;
    return 404; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name *.sez.letsmeet.lol;
    return 301 https://$host$request_uri;
}
